<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EmulatorJS settings</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --fg:#1c1e21; --muted:#6b7280; --line:#e0e2e6;
    --brand:#1976d2; --brand-fg:#ffffff; --danger:#c62828; --ok:#2e7d32;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121417; --card:#1c1f23; --fg:#e6e8ea; --muted:#9aa3ad; --line:#2c3036;
           --brand:#4d9bf0; --brand-fg:#0b1622; --danger:#ef5350; --ok:#66bb6a; }
  }
  *{ box-sizing:border-box }
  body{ margin:0; background:var(--bg); color:var(--fg);
        font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif }
  header{ position:sticky; top:0; z-index:5; display:flex; flex-wrap:wrap; gap:.75em;
          align-items:center; justify-content:space-between; padding:.9em 1.2em;
          background:var(--card); border-bottom:1px solid var(--line) }
  h1{ margin:0; font-size:1.15rem }
  h2{ margin:0; font-size:1rem }
  main{ max-width:1000px; margin:0 auto; padding:1.2em }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:10px;
         padding:1.1em 1.2em; margin-bottom:1.1em }
  .card > p.desc{ margin:.2em 0 1em; color:var(--muted); font-size:.9em }
  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:.9em 1.2em }
  .field{ display:flex; flex-direction:column; gap:.35em }
  .field.full{ grid-column:1/-1 }
  label{ font-weight:600; font-size:.9em }
  .help{ color:var(--muted); font-size:.82em }
  .check{ display:flex; align-items:center; gap:.6em }
  .check label{ font-weight:500 }
  .check input{ width:auto }
  input[type=text], input[type=number], input[type=password], select, textarea{
    width:100%; padding:.5em .6em; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); color:var(--fg); font:inherit }
  textarea{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.85em; resize:vertical }
  .badge{ display:inline-block; padding:.22em .65em; border-radius:999px; font-size:.78em; font-weight:700 }
  .badge.ok{ background:rgba(46,125,50,.12); color:var(--ok) }
  .badge.warn{ background:rgba(198,40,40,.12); color:var(--danger) }
  button{ font:inherit; padding:.5em 1em; border-radius:6px; border:1px solid var(--line);
          background:var(--bg); color:var(--fg); cursor:pointer }
  button:hover:not(:disabled){ border-color:var(--brand) }
  button:disabled{ opacity:.5; cursor:default }
  button.primary{ background:var(--brand); border-color:var(--brand); color:var(--brand-fg); font-weight:600 }
  button.small{ padding:.25em .6em; font-size:.9rem }
  .row-actions{ display:flex; gap:.35em; align-items:center }
  .sys-row{ border:1px solid var(--line); border-radius:8px; padding:.85em; margin-bottom:.8em }
  .sys-head{ display:flex; align-items:center; justify-content:space-between; gap:.5em; flex-wrap:wrap; margin-bottom:.7em }
  .sys-head b{ font-size:.9rem }
  .sys-row.collapsed .grid{ display:none }
  .sys-toggle{ min-width:1.7em; transition:transform .15s ease }
  .sys-row:not(.collapsed) .sys-toggle{ transform:rotate(90deg) }
  .status{ color:var(--muted); font-size:.9rem; min-height:1em }
  .banner{ margin:0 0 1.1em; padding:.8em 1em; border-radius:8px; border:1px solid var(--line); background:var(--card) }
  .banner.error{ border-color:var(--danger); color:var(--danger) }
  .banner.ok{ border-color:var(--ok); color:var(--ok) }
  .toolbar{ display:flex; gap:.6em; align-items:center; flex-wrap:wrap; margin-top:.9em }
  [hidden]{ display:none !important }
</style>
</head>
<body>
<header>
  <h1>EmulatorJS settings</h1>
  <div style="display:flex;align-items:center;gap:.8em">
    <span id="status" class="status"></span>
    <button id="save" class="primary" type="button">Save changes</button>
  </div>
</header>
<main>
  <div id="banner" class="banner" hidden></div>
  <div id="form"><p class="help">Loading…</p></div>
</main>
<script>
(function () {
  'use strict';

  var apiBase = new URL('../api/', location.href);
  var statusEl = document.getElementById('status');
  var bannerEl = document.getElementById('banner');
  var formEl   = document.getElementById('form');
  var saveBtn  = document.getElementById('save');

  var config  = {};
  var systems = [];
  var rowOpen = [];

  var ENT = {
    '&': '\x26amp;', '<': '\x26lt;', '>': '\x26gt;',
    '"': '\x26quot;', "'": '\x26#39;',
  };
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ENT[c]; });
  }

  function isJson(s) { try { JSON.parse(s); return true; } catch (e) { return false; } }

  function setStatus(t) { statusEl.textContent = t || ''; }
  function setBanner(msg, kind) {
    if (!msg) { bannerEl.hidden = true; bannerEl.textContent = ''; bannerEl.className = 'banner'; return; }
    bannerEl.hidden = false;
    bannerEl.textContent = msg;
    bannerEl.className = 'banner ' + (kind || '');
  }

  function api(name, params) {
    return fetch(new URL('_' + name, apiBase), {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-hfs-anti-csrf': '1' },
      body: JSON.stringify(params || {}),
      credentials: 'same-origin',
    }).then(function (res) {
      return res.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = text; }
        if (!res.ok) {
          var msg = (data && data.error) || (typeof data === 'string' && data) || res.statusText || ('HTTP ' + res.status);
          throw new Error(msg);
        }
        return data;
      });
    });
  }

  var SECTIONS = [
    { title: 'ROM icons', desc: 'How consoles and ROM files look in HFS folder listings. The icon theme is used for console icons; icon overlays on ROM files come from the artwork and icon settings below.', fields: [
      { k:'iconTheme', type:'select', label:'Icon theme', help:'Visual style of the console/system icons.', options: [
        ['automatic','Automatic'], ['monochrome','Monochrome'], ['daite','Daite'],
        ['flatux','FlatUX'], ['systematic','Systematic'],
      ] },
      { k:'iconFolder', type:'text', label:'Icon subfolder name',
        help:'Folder (relative to each ROM) that may hold artwork placed by hand, e.g. images → /roms/snes/images/. Artwork placed here takes priority over remote artwork.' },
      { k:'iconThumbSuffix', type:'text', label:'Thumbnail filename suffix',
        help:'Appended to the ROM filename (without extension) to find its thumbnail, e.g. -thumb → MyGame-thumb.png.' },
      { k:'iconPreviewSuffix', type:'text', label:'Preview filename suffix',
        help:'Appended to the ROM filename to find the hover-preview image, e.g. -image → MyGame-image.png.' },
    ] },
    { title: 'Artwork', desc: 'When on, cover art is looked up for the detected console and loaded directly in your browser.', fields: [
      { k:'customIcons', type:'bool', label:'Custom ROM icons',
        help:'When ON, ROM files get a thumbnail/preview icon overlay for extensions in the console map. When OFF, HFS uses its regular icons everywhere.' },
      { k:'artworkOnDemand', type:'bool', label:'Fetch artwork on demand',
        help:'When ON, artwork for a ROM is looked up the first time it is shown. When OFF, only local images are used.' },
    ] },
    { title: 'EmulatorJS core source', desc: 'Where the browser loads EmulatorJS cores and data from. The stable/latest/nightly release channel can also be managed in the HFS admin dialog; choosing an option here overrides it.', fields: [
      { k:'ejsDataSource', type:'select', label:'EmulatorJS data source', help:'Which EmulatorJS build to load. "Local" serves an EmulatorJS release from a folder on this server (set the path below) and never falls back to the CDN — every core you need must be in that folder. EmulatorJS and its cores are separate projects under their own licenses and are not bundled with this plugin.', options: [
        ['', 'Use the "EmulatorJS Version" setting (admin dialog)'],
        ['stable','Stable (recommended)'], ['latest','Latest'], ['nightly','Nightly'],
        ['local','Local (folder on this server)'], ['custom','Custom URL →'],
      ] },
      { k:'ejsLocalDir', type:'text', label:'Local EmulatorJS folder (disk path)', showWhen:'local',
        help:'Used when the source is "Local". Absolute path on this machine to a folder containing an extracted EmulatorJS release (the folder with loader.js and the cores). You download and provide it yourself; it is not bundled.' },
      { k:'ejsLocalReady', type:'badge', label:'Local folder ready',
        help:'Whether the folder set above contains loader.js. Updated when the settings are saved.' },
      { k:'ejsDataCustomUrl', type:'text', label:'Custom EmulatorJS data URL', showWhen:'custom',
        help:'Only used when the source is "custom". Must end with a slash, e.g. https://cdn.emulatorjs.org/4.0.9/data/' },
    ] },
    { title: 'Credentials', desc: 'Optional API keys for game metadata and covers. Leave a field blank to keep its current value.', fields: [
      { k:'igdbClientId', type:'text', label:'IGDB Client ID',
        help:'From https://dev.twitch.tv/console/apps (Twitch application credentials). Used for game info and covers.' },
      { k:'igdbClientSecret', type:'password', label:'IGDB Client Secret',
        help:'From https://dev.twitch.tv/console/apps. Kept secret — only shown as dots.' },
      { k:'thegamesdbApiKey', type:'password', label:'TheGamesDB API Key',
        help:'Optional. From https://thegamesdb.net/ (account → API tab).' },
    ] },
  ];

  function fieldHTML(f) {
    var id = 'f_' + f.k, help = f.help ? '<div class="help">' + esc(f.help) + '</div>' : '';
    var field = '';
    if (f.type === 'bool')
      field = '<div class="field"><div class="check">'
        + '<input type="checkbox" id="' + id + '" data-k="' + esc(f.k) + '">'
        + '<label for="' + id + '">' + esc(f.label) + '</label></div>' + help + '</div>';
    else if (f.type === 'badge')
      field = '<div class="field"><label for="' + id + '">' + esc(f.label) + '</label>'
        + '<span class="badge warn" id="' + id + '">Not ready</span>' + help + '</div>';
    else {
      var input;
      if (f.type === 'select')
        input = '<select id="' + id + '" data-k="' + esc(f.k) + '">'
          + f.options.map(function (o) { return '<option value="' + esc(o[0]) + '">' + esc(o[1]) + '</option>'; }).join('')
          + '</select>';
      else if (f.type === 'number')
        input = '<input type="number" id="' + id + '" data-k="' + esc(f.k) + '"'
          + (f.min != null ? ' min="' + f.min + '"' : '') + (f.step != null ? ' step="' + f.step + '"' : '') + '>';
      else
        input = '<input type="' + (f.type === 'password' ? 'password' : 'text') + '" id="' + id + '" data-k="' + esc(f.k) + '">';
      field = '<div class="field"><label for="' + id + '">' + esc(f.label) + '</label>' + input + help + '</div>';
    }
    if (f.showWhen) field = field.replace('<div class="field"', '<div class="field" data-src-show="' + esc(f.showWhen) + '"');
    return field;
  }

  function updateSrcVisibility() {
    var srcEl = document.getElementById('f_ejsDataSource');
    var src = srcEl ? srcEl.value : '';
    var targets = formEl.querySelectorAll('[data-src-show]');
    [].forEach.call(targets, function (t) { t.hidden = t.getAttribute('data-src-show') !== src; });
  }

  var SYS_FIELDS = [
    { k:'system', label:'System ID', ph:'myconsole', required:true, help:'Short unique ID; also matched against the ROM folder name.' },
    { k:'name', label:'Display name', ph:'My Console', required:true },
    { k:'extensions', label:'File extensions', ph:'rom,bin,zip', help:'Comma-separated, no dots.' },
    { k:'core', label:'EmulatorJS core(s)', ph:'core1,core2', help:'Comma-separated core IDs. Prefix a core with "//" to disable it.' },
    { k:'bios', label:'BIOS file name', ph:'e.g. bios.bin', help:'Optional. Filename of the BIOS/firmware this system needs, placed in the same folder as the ROM. Leave blank if none is required — you must supply the file yourself.' },
    { k:'aliases', label:'Folder names', ph:'folder1,folder2', help:'Extra folder names that resolve to this system.' },
    { k:'artworkRepo', label:'Artwork repo', ph:'Vendor_-_System', help:'Libretro thumbnail source for this system (thumbnails.libretro.com folder; GitHub repo as fallback). Leave blank to skip artwork lookup for this system.' },
    { k:'gamepadLayout', label:'Gamepad layout (JSON)', type:'json', help:'Virtual gamepad buttons for this core as a JSON array. Blank = virtual gamepad disabled.' },
  ];

  function blankRow() {
    return { system:'', name:'', extensions:'', core:'', bios:'', aliases:'', artworkRepo:'', gamepadLayout:'' };
  }
  function toStr(v) { return Array.isArray(v) ? v.join(',') : (v == null ? '' : String(v)); }
  function normalizeRow(r) {
    return { system:toStr(r.system), name:toStr(r.name), extensions:toStr(r.extensions),
             core:toStr(r.core), bios:toStr(r.bios), aliases:toStr(r.aliases), artworkRepo:toStr(r.artworkRepo),
             gamepadLayout:toStr(r.gamepadLayout) };
  }

  function readSystems() {
    return [].slice.call(formEl.querySelectorAll('.sys-row')).map(function (row) {
      var out = {};
      SYS_FIELDS.forEach(function (f) {
        var el = row.querySelector('[data-f="' + f.k + '"]');
        out[f.k] = el ? el.value.trim() : '';
      });
      return out;
    });
  }

  function renderSystems(open) {
    var wrap = document.getElementById('systems');
    if (!wrap) return;
    if (Array.isArray(open)) rowOpen = open.slice();
    for (var k = 0; k < systems.length; k++) if (typeof rowOpen[k] !== 'boolean') rowOpen[k] = false;
    rowOpen.length = systems.length;
    if (!systems.length) {
      wrap.innerHTML = '<p class="help">No rows — the built-in system map is used. Click “Add system” to define your own list.</p>';
      return;
    }
    wrap.innerHTML = systems.map(function (row, i) {
      var fields = SYS_FIELDS.map(function (f) {
        var id = 's_' + i + '_' + f.k, val = esc(row[f.k] || ''), help = f.help ? '<div class="help">' + esc(f.help) + '</div>' : '';
        var input = f.type === 'json'
          ? '<textarea id="' + id + '" data-f="' + f.k + '" rows="3">' + val + '</textarea>'
          : '<input type="text" id="' + id + '" data-f="' + f.k + '" value="' + val + '" placeholder="' + esc(f.ph || '') + '">';
        return '<div class="field' + (f.type === 'json' ? ' full' : '') + '">'
          + '<label for="' + id + '">' + esc(f.label) + (f.required ? ' *' : '') + '</label>' + input + help + '</div>';
      }).join('');
      var isOpen = rowOpen[i] === true;
      return '<div class="sys-row' + (isOpen ? '' : ' collapsed') + '" data-i="' + i + '">'
        + '<div class="sys-head"><b>' + esc(row.system || '(new system)') + (row.name ? ' — ' + esc(row.name) : '') + '</b>'
        + '<div class="row-actions">'
        + '<button class="small sys-toggle" type="button" data-act="toggle" data-i="' + i + '" aria-expanded="' + (isOpen ? 'true' : 'false') + '" title="Expand / collapse">▸</button>'
        + '<button class="small" type="button" data-act="up" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + ' title="Move up">↑</button>'
        + '<button class="small" type="button" data-act="down" data-i="' + i + '"' + (i === systems.length - 1 ? ' disabled' : '') + ' title="Move down">↓</button>'
        + '<button class="small" type="button" data-act="del" data-i="' + i + '" title="Remove">✕</button>'
        + '</div></div><div class="grid">' + fields + '</div></div>';
    }).join('');
    var allBtn = document.getElementById('toggleAllSys');
    if (allBtn) allBtn.textContent = rowOpen.some(function (v) { return v !== false; }) ? 'Collapse all' : 'Expand all';
  }

  function applyValues() {
    SECTIONS.forEach(function (sec) {
      sec.fields.forEach(function (f) {
        var el = document.getElementById('f_' + f.k);
        if (!el) return;
        if (f.type === 'bool') { el.checked = !!config[f.k]; return; }
        if (f.type === 'badge') {
          var ready = !!config[f.k];
          el.textContent = ready ? 'Ready' : 'Not ready';
          el.className = 'badge ' + (ready ? 'ok' : 'warn');
          return;
        }
        if (f.type === 'password') {
          el.value = '';
          el.setAttribute('placeholder', config[f.k] ? '•••••• (saved — leave blank to keep)' : '');
          return;
        }
        el.value = config[f.k] == null ? '' : config[f.k];
      });
    });
    updateSrcVisibility();
  }

  function render() {
    formEl.innerHTML = SECTIONS.map(function (sec) {
      return '<section class="card"><h2>' + esc(sec.title) + '</h2>'
        + (sec.desc ? '<p class="desc">' + esc(sec.desc) + '</p>' : '')
        + '<div class="grid">' + sec.fields.map(fieldHTML).join('') + '</div>'
        + '</section>';
    }).join('')
    + '<section class="card">'
      + '<div class="sys-head"><h2>Console / system map</h2>'
      + '<div class="row-actions">'
      + '<button class="small" type="button" id="toggleAllSys">Collapse all</button>'
      + '<button class="small" type="button" id="resetSys">Restore built-in list</button>'
      + '<button class="small" type="button" id="addSys">+ Add system</button>'
      + '</div></div>'
      + '<p class="desc">Maps file extensions and folder names to systems and EmulatorJS cores. '
      + 'Folder detection lets shared extensions (.bin/.iso/.cue) route to the right system. '
      + 'Prefix a core with “//” to disable it. Saving an empty list restores the built-in defaults.</p>'
      + '<div id="systems"></div></section>'
      + '<section class="card"><h2>Disclaimer &amp; notices</h2>'
      + '<p class="help">All product, system and brand names are trademarks or registered trademarks of their respective owners, used here for identification only.</p>'
      + '<p class="help" style="margin-top:.5em">This plugin is not affiliated with, sponsored by, or endorsed by any console manufacturer, EmulatorJS, libretro, or the libretro-thumbnails project. The MIT License covers only this plugin\'s source code — not ROMs, BIOS/firmware, box art, or third-party components. You are responsible for having the rights to any game files, BIOS files and artwork you use.</p>'
      + '</section>';

    applyValues();
    renderSystems();

    document.getElementById('f_ejsDataSource').addEventListener('change', updateSrcVisibility);
    document.getElementById('addSys').addEventListener('click', function () {
      systems = readSystems(); systems.unshift(blankRow()); rowOpen.unshift(true); renderSystems();
    });
    document.getElementById('resetSys').addEventListener('click', resetSystems);
    document.getElementById('toggleAllSys').addEventListener('click', function () {
      var anyOpen = rowOpen.some(function (v) { return v !== false; });
      rowOpen = systems.map(function () { return !anyOpen; });
      renderSystems();
    });
  }

  function collect() {
    var out = {};
    SECTIONS.forEach(function (sec) {
      sec.fields.forEach(function (f) {
        var el = document.getElementById('f_' + f.k);
        if (!el) return;
        if (f.type === 'bool') out[f.k] = el.checked;
        else if (f.type === 'badge') return;
        else if (f.type === 'password') { var p = el.value.trim(); if (p) out[f.k] = p; }
        else if (f.type === 'number') { var n = el.value.trim(); out[f.k] = n === '' ? null : Number(n); }
        else out[f.k] = el.value;
      });
    });
    out.systemMap = readSystems();
    return out;
  }

  function save() {
    setBanner('');
    var cfg = collect();
    var bad = cfg.systemMap.filter(function (r) { return !r.system || !r.name; })[0];
    if (bad) { setBanner('Every system row needs a System ID and a Display name.', 'error'); return; }
    var badJson = cfg.systemMap.filter(function (r) { return r.gamepadLayout && !isJson(r.gamepadLayout); })[0];
    if (badJson) { setBanner('Gamepad layout for "' + (badJson.system || '?') + '" is not valid JSON.', 'error'); return; }

    saveBtn.disabled = true;
    setStatus('Saving…');
    api('emulatorjsSetConfig', { config: cfg }).then(function (res) {
      config = (res && res.config) || cfg;
      applyValues();
      var saved = Array.isArray(config.systemMap) ? config.systemMap : [];
      if (saved.length) { systems = saved.map(normalizeRow); renderSystems(); }
      else {
        api('emulatorjsDefaultSystemMap').then(function (d) {
          systems = ((d && d.systemMap) || []).map(normalizeRow);
          renderSystems();
        }).catch(function () { systems = readSystems(); renderSystems(); });
      }
      setStatus('Saved');
      setBanner('Settings saved. Refresh the HFS browser tab (F5) to see the changes.', 'ok');
      setTimeout(function () { setStatus(''); }, 3500);
    }).catch(function (e) {
      setStatus('');
      setBanner('Could not save: ' + e.message, 'error');
    }).then(function () { saveBtn.disabled = false; });
  }

  function resetSystems() {
    if (!confirm('Replace the current console / system map with the built-in list? Unsaved edits to the list will be lost.')) return;
    api('emulatorjsDefaultSystemMap').then(function (d) {
      systems = ((d && d.systemMap) || []).map(normalizeRow);
      rowOpen = [];
      renderSystems();
      setBanner('Built-in system list loaded — click “Save changes” to apply.', 'ok');
    }).catch(function (e) { setBanner(e.message, 'error'); });
  }

  saveBtn.addEventListener('click', save);
  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); save(); }
  });
  formEl.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-act]');
    if (!el) return;
    e.preventDefault();
    var i = Number(el.dataset.i), act = el.dataset.act;

    if (act === 'toggle') {
      var rowEl = el.closest('.sys-row');
      if (rowEl) {
        var collapsedNow = rowEl.classList.toggle('collapsed');
        rowOpen[i] = !collapsedNow;
        el.setAttribute('aria-expanded', String(!collapsedNow));
        var allBtn = document.getElementById('toggleAllSys');
        if (allBtn) allBtn.textContent = rowOpen.some(function (v) { return v === true; }) ? 'Collapse all' : 'Expand all';
      }
      return;
    }

    var cur = readSystems();
    if (act === 'del') {
      var row = cur[i] || {};
      var label = row.system || row.name || '';
      if (!confirm('Remove the ' + (label ? '“' + label + '” ' : '') + 'console block? Click “Save changes” to apply.')) return;
      cur.splice(i, 1); rowOpen.splice(i, 1);
    }
    else if (act === 'up' && i > 0) { var a = cur[i - 1]; cur[i - 1] = cur[i]; cur[i] = a; var o = rowOpen[i - 1]; rowOpen[i - 1] = rowOpen[i]; rowOpen[i] = o; }
    else if (act === 'down' && i < cur.length - 1) { var b = cur[i + 1]; cur[i + 1] = cur[i]; cur[i] = b; var p = rowOpen[i + 1]; rowOpen[i + 1] = rowOpen[i]; rowOpen[i] = p; }
    systems = cur;
    renderSystems();
  });

  (function load() {
    api('emulatorjsGetConfig').then(function (cfg) {
      config = cfg || {};
      var rows = Array.isArray(config.systemMap) ? config.systemMap : [];
      if (rows.length) { systems = rows.map(normalizeRow); render(); return; }
      api('emulatorjsDefaultSystemMap').then(function (d) {
        systems = ((d && d.systemMap) || []).map(normalizeRow);
        render();
      }).catch(function () { systems = []; render(); });
    }).catch(function (e) {
      formEl.innerHTML = '';
      setBanner('Could not load settings: ' + e.message
        + ' — make sure you are logged in as an HFS administrator.', 'error');
    });
  })();
})();
</script>
</body>
</html>
