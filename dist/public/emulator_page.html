<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EmulatorJS - Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        #header {
            padding: 10px 16px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 8px
        }

        #header h1 {
            font-size: 16px;
            flex: 1
        }

        #closeBtn {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 8px 16px !important;
            font-size: 14px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            box-shadow: 0 2px 8px rgba(255, 68, 68, 0.4) !important;
            transition: all 0.3s ease !important;
        }

        #closeBtn:hover {
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%) !important;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.6) !important;
            transform: scale(1.05) !important;
        }

        #closeBtn:active {
            transform: scale(0.95) !important;
        }

        #game {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 600px;
            width: 100%;
            background: #000
        }

        iframe,
        canvas {
            width: 100%;
            height: 100%;
            border: 0
        }

        .loading-message {
            color: #aaa;
            padding: 10px;
            text-align: center;
            font-size: 14px
        }

    
        .ejs_start_button {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 9999 !important;
            background: linear-gradient(135deg, #1aafff 0%, #0086cc 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 35px 50px !important;
            min-height: 80px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 24px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(26, 175, 255, 0.4) !important;
            transition: all 0.3s ease !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .ejs_start_button:hover {
            background: linear-gradient(135deg, #0086cc 0%, #005a99 100%) !important;
            box-shadow: 0 6px 20px rgba(26, 175, 255, 0.6) !important;
            transform: translate(-50%, -50%) scale(1.05) !important;
        }

        .ejs_start_button:active {
            transform: translate(-50%, -50%) scale(0.95) !important;
        }
    </style>
</head>

<body>
    <div id="header">
        <h1 id="title">Emulator</h1>
        <button id="closeBtn">Close</button>
    </div>
    <div id="game"></div>

    <script>
        // Extract parameters BEFORE any code
        function qs(name) {
            const params = new URLSearchParams(location.search);
            return params.get(name) || ''
        }

        const gameUrl = qs('game')
        const core = qs('core') || ''

        console.log('[EmulatorJS] Extracted parameters:')
        console.log('[EmulatorJS] - gameUrl:', gameUrl)
        console.log('[EmulatorJS] - core:', core)

        if (!gameUrl || !core) {
            console.error('[EmulatorJS] Error: game or core not specified')
            document.getElementById('game').innerHTML = '<div style="color: #aaa; padding: 20px;">Error: Invalid parameters</div>'
            throw new Error('Invalid parameters')
        }

        // Configure title
        document.getElementById('title').textContent = `Emulator - ${core}`
        document.getElementById('closeBtn').addEventListener('click', () => window.close())

        // IMPORTANT: Global variables MUST be defined BEFORE loading loader.js
        // Do not use window.EJS_* - use direct global variables!
        EJS_player = '#game'
        EJS_gameUrl = gameUrl
        EJS_core = core
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'

        console.log('[EmulatorJS] Global variables set:')
        console.log('[EmulatorJS] - EJS_player:', EJS_player)
        console.log('[EmulatorJS] - EJS_gameUrl:', EJS_gameUrl)
        console.log('[EmulatorJS] - EJS_core:', EJS_core)
        console.log('[EmulatorJS] - EJS_pathtodata:', EJS_pathtodata)
    </script>

    <!-- IMPORTANT: loader.js must be loaded AFTER global variables are set -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

    <script>
        // Check if loader.js created the interface
        window.addEventListener('load', () => {
            setTimeout(() => {
                console.log('[EmulatorJS] After load event:')
                console.log('[EmulatorJS] - window.EJS exists?', !!window.EJS)
                console.log('[EmulatorJS] - #game children:', document.getElementById('game').children.length)

                const ecsGame = document.querySelector('.ejs_game')
                if (ecsGame) {
                    console.log('[EmulatorJS] ✓ Emulator interface created successfully!')
                } else {
                    console.warn('[EmulatorJS] ⚠️ Emulator interface not found')
                }
            }, 500)
        })

        // Error listener
        window.addEventListener('error', (event) => {
            console.error('[EmulatorJS] Error:', event.error)
        })
    </script>
</body>
