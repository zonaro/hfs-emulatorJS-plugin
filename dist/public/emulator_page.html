<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EmulatorJS - Player</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            background: #111;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column
        }

        #header {
            padding: 10px 16px;
            background: #0d0d0d;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            gap: 8px
        }

        #header h1 {
            font-size: 16px;
            flex: 1;
        }

        #username {
            color: #1AAFFF;
            font-size: 14px;
            font-weight: 600;
            padding: 6px 12px;
            background: rgba(26, 175, 255, 0.1);
            border-radius: 4px;
            border: 1px solid rgba(26, 175, 255, 0.3);
        }

        #closeBtn {
            background: linear-gradient(135deg, #ff4444 0%, #cc0000 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 6px !important;
            padding: 8px 16px !important;
            font-size: 14px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            box-shadow: 0 2px 8px rgba(255, 68, 68, 0.4) !important;
            transition: all 0.3s ease !important;
        }

        #closeBtn:hover {
            background: linear-gradient(135deg, #cc0000 0%, #990000 100%) !important;
            box-shadow: 0 4px 12px rgba(255, 68, 68, 0.6) !important;
            transform: scale(1.05) !important;
        }

        #closeBtn:active {
            transform: scale(0.95) !important;
        }

        #game {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            min-height: 600px;
            width: 100%;
            background: #000
        }

        iframe,
        canvas {
            width: 100%;
            height: 100%;
            border: 0
        }

        .loading-message {
            color: #aaa;
            padding: 10px;
            text-align: center;
            font-size: 14px
        }


        .ejs_start_button {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            z-index: 9999 !important;
            background: linear-gradient(135deg, #1aafff 0%, #0086cc 100%) !important;
            color: white !important;
            border: none !important;
            border-radius: 8px !important;
            padding: 35px 50px !important;
            min-height: 80px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 24px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            box-shadow: 0 4px 15px rgba(26, 175, 255, 0.4) !important;
            transition: all 0.3s ease !important;
            visibility: visible !important;
            opacity: 1 !important;
        }

        .ejs_start_button:hover {
            background: linear-gradient(135deg, #0086cc 0%, #005a99 100%) !important;
            box-shadow: 0 6px 20px rgba(26, 175, 255, 0.6) !important;
            transform: translate(-50%, -50%) scale(1.05) !important;
        }

        .ejs_start_button:active {
            transform: translate(-50%, -50%) scale(0.95) !important;
        }
    </style>
</head>

<body>
    <div id="header">
        <h1 id="title">Emulator</h1>
        <span id="username"></span>
        <button id="closeBtn">Close</button>
    </div>
    <div id="game"></div>

    <!-- Load emulator_page.js BEFORE loader.js so hooks are in place -->
    <script>

        // EmulatorJS page: parameter extraction, initialization, and save sync hooks

        // Extract query parameters BEFORE any code
        function qs(name) {
            const params = new URLSearchParams(location.search);
            return params.get(name) || ''
        }

        const gameUrl = qs('game')
        const core = qs('core') || ''

        console.log('[EmulatorJS] Extracted parameters:')
        console.log('[EmulatorJS] - gameUrl:', gameUrl)
        console.log('[EmulatorJS] - core:', core)

        if (!gameUrl || !core) {
            console.error('[EmulatorJS] Error: game or core not specified')
            throw new Error('Invalid parameters')
        }

        // Configure UI on DOM ready
        document.addEventListener('DOMContentLoaded', () => {
            const username = qs('username') || 'Guest';
            document.getElementById('title').textContent = `Emulator - ${core}`
            document.getElementById('username').textContent = username;
            document.getElementById('closeBtn').addEventListener('click', () => window.close())
        })

        // IMPORTANT: Global variables MUST be defined BEFORE loading loader.js
        // Determine EmulatorJS CDN version from querystring (accepted values: stable, latest, nightly)
        const _version = (qs('version') || 'stable').toLowerCase();
        const _allowed = ['stable', 'latest', 'nightly'];
        const _chosenVersion = _allowed.includes(_version) ? _version : 'stable';

        EJS_player = '#game'
        EJS_gameUrl = gameUrl
        EJS_core = core
        EJS_pathtodata = `https://cdn.emulatorjs.org/${_chosenVersion}/data/`;

        console.log('[EmulatorJS] Global variables set:')
        console.log('[EmulatorJS] - version:', _chosenVersion)
        console.log('[EmulatorJS] - EJS_pathtodata:', EJS_pathtodata)
        console.log('[EmulatorJS] - EJS_player:', EJS_player)
        console.log('[EmulatorJS] - EJS_gameUrl:', EJS_gameUrl)
        console.log('[EmulatorJS] - EJS_core:', EJS_core)


        // Handle CDN errors gracefully
        window.addEventListener('error', (event) => {
            console.error('[EmulatorJS] Error:', event.error);
        }, true);

        const PLUGIN = 'emulatorJS-plugin';
        let currentGame = null;
        let isLoggedIn = false;
        let originalEJSFunctions = {};


        const PLUGINS_PUB_URI = '/~/plugins/';

        // Detect if user is logged in
        function checkLoginStatus() {
            const username = qs('username') || '';
            isLoggedIn = !!username;
            console.log('[EmulatorJS] Login status:', { username, isLoggedIn });
            return isLoggedIn;
        }

        async function rest(name, params) {
            console.log('[EmulatorJS] REST call', name, params);
            try {
                // Use HFS.customRestCall if available (when inside HFS frontend context)
                if (typeof HFS !== 'undefined' && HFS.customRestCall) {
                    return await HFS.customRestCall(name, params || {});
                }

                // Fallback to direct fetch for standalone emulator page
                const url = `${PLUGINS_PUB_URI}${PLUGIN}/${name}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify(params || {})
                });

                if (!response.ok) {
                    console.error('[EmulatorJS] REST call failed:', response.status, response.statusText);
                    return { success: false, error: `HTTP ${response.status}` };
                }

                const res = await response.json();
                console.log('[EmulatorJS] REST result', name, res);
                return res;
            } catch (err) {
                console.error('[EmulatorJS] REST call error', name, err);
                return { success: false, error: err.message };
            }
        }

        function b64(buf) {
            if (buf instanceof Uint8Array) buf = buf.buffer;
            const bytes = new Uint8Array(buf);
            // Convert in chunks to avoid call stack overflow for large buffers
            const chunkSize = 0x8000; // 32768
            let binary = '';
            for (let i = 0; i < bytes.length; i += chunkSize) {
                const sub = bytes.subarray(i, i + chunkSize);
                // String.fromCharCode.apply(null, sub) works with moderately sized arrays
                binary += String.fromCharCode.apply(null, sub);
            }
            return btoa(binary);
        }

        async function list(game) {
            return rest('list', { game });
        }

        async function saveState(game, slot, stateU8, screenshotU8) {
            console.log('[EmulatorJS] saveState start', { game, slot, stateBytes: stateU8?.byteLength || 0, screenshotBytes: screenshotU8?.byteLength || 0 });
            const res = await rest('saveState', {
                game,
                slot,
                stateBase64: b64(stateU8),
                screenshotBase64: screenshotU8 ? b64(screenshotU8) : undefined
            });
            if (res && (res.ok || res.success)) {
                console.log('[EmulatorJS] saveState success', { game, slot });
            } else {
                console.warn('[EmulatorJS] saveState failed', { game, slot, res });
            }
            return res;
        }

        async function deleteState(game, slot) {
            console.log('[EmulatorJS] deleteState', { game, slot });
            return rest('deleteState', { game, slot });
        }

        async function saveSram(game, sramU8) {
            console.log('[EmulatorJS] saveSram start', { game, bytes: sramU8?.byteLength || 0 });
            const res = await rest('saveSram', { game, dataBase64: b64(sramU8) });
            if (res && (res.ok || res.success)) {
                console.log('[EmulatorJS] saveSram success', { game });
            } else {
                console.warn('[EmulatorJS] saveSram failed', { game, res });
            }
            return res;
        }

        // EJS_onSaveState: Called when save state button is pressed
        // Receives an array with [screenshot, saveState]
        EJS_onSaveState = function (e) {
            const gameName = typeof EJS_gameName !== 'undefined' ? EJS_gameName : gameUrl;
            console.log('[EmulatorJS] EJS_onSaveState triggered', { gameName, payload: e, arrayLength: e?.length });
            let screenshotU8 = null;
            let stateU8 = null;

            // Support both array [screenshot, state] and object { screenshot, state } or { save, screenshot }
            if (Array.isArray(e) && e.length >= 2) {
                screenshotU8 = e[0];
                stateU8 = e[1];
            } else if (e && typeof e === 'object') {
                screenshotU8 = e.screenshot || e[0] || null;
                stateU8 = e.state || e.save || e[1] || null;
            }

            if (!stateU8) {
                console.warn('[EmulatorJS] EJS_onSaveState: Invalid data received (no state)', { e });
                return;
            }

            saveState(gameName, 1, stateU8, screenshotU8);
        };

        // EJS_onSaveUpdate: Called when save file changes (detected by hash comparison)
        // Receives an object with { hash, save, screenshot, format }
        EJS_onSaveUpdate = function (e) {
            const gameName = typeof EJS_gameName !== 'undefined' ? EJS_gameName : gameUrl;
            console.log('[EmulatorJS] EJS_onSaveUpdate triggered', {
                gameName,
                hash: e?.hash,
                saveBytes: e?.save?.byteLength || 0,
                screenshotBytes: e?.screenshot?.byteLength || 0,
                format: e?.format
            });
            if (!e || !e.save) {
                console.warn('[EmulatorJS] EJS_onSaveUpdate: Invalid data received');
                return;
            }
            const sramU8 = e.save;  // Save buffer (Uint8Array)
            saveSram(gameName, sramU8);
        };

        // EJS_onLoadState: Called when load state button is pressed
        EJS_onLoadState = async function (e) {
            const gameName = typeof EJS_gameName !== 'undefined' ? EJS_gameName : gameUrl;
            console.log('[EmulatorJS] EJS_onLoadState triggered', { gameName });
            try {
                const res = await rest('loadState', { game: gameName, slot: 1 });

                if (!res || !res.success) {
                    console.warn('[EmulatorJS] EJS_onLoadState: No state found on server', { res });
                    return;
                }

                // The state data should be base64 encoded from the server
                if (!res.stateBase64) {
                    console.warn('[EmulatorJS] EJS_onLoadState: No state data in response', { res });
                    return;
                }

                // Convert base64 string to Uint8Array
                const binaryString = atob(res.stateBase64);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }

                // Create a blob URL for the state file
                const stateBlob = new Blob([bytes], { type: 'application/octet-stream' });
                const stateUrl = URL.createObjectURL(stateBlob);

                // Update EJS_loadStateURL to load this state
                EJS_loadStateURL = stateUrl;

                console.log('[EmulatorJS] EJS_onLoadState: State loaded successfully', {
                    gameName,
                    stateBytes: bytes.byteLength,
                    blobUrl: stateUrl
                });

            } catch (err) {
                console.error('[EmulatorJS] EJS_onLoadState: Error loading state', err);
            }
        };







    </script>

    <!-- IMPORTANT: loader.js must be loaded AFTER global variables are set -->
    <script>
        // Dynamically load loader.js from the selected CDN version
        (function () {
            try {
                const _script = document.createElement('script');
                _script.src = (typeof EJS_pathtodata !== 'undefined' ? EJS_pathtodata : 'https://cdn.emulatorjs.org/latest/data/') + 'loader.js';
                _script.crossOrigin = 'anonymous';
                _script.onload = () => console.log('[EmulatorJS] loader.js loaded from', _script.src);
                _script.onerror = (e) => console.error('[EmulatorJS] Failed to load loader.js', e);
                document.head.appendChild(_script);
            } catch (err) {
                console.error('[EmulatorJS] Error injecting loader.js', err);
            }
        })();
    </script>

</body>
